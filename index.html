    try{const p=await gs("get_values",{spreadsheetId:sid,range:"'INSTAGRAM'!A4:X900"});const rows=parseIgTab((p&&p.values)||[],ym);S.data[ym].INSTAGRAM=rows;log.push("INSTAGRAM "+rows.length)}
    catch(e){if(e.code!=="tool_error")throw e;log.push("INSTAGRAM: tab tidak ditemukan")}
    // new pillars / statuses become dropdown options
    Object.entries(S.data[ym]).forEach(([code,rows])=>{const ig=code==="INSTAGRAM";rows.forEach(r=>{if(r.pil)addToList(ig?"pil:ig":"pil:tt",r.pil);if(r.st)addToList(ig?"st:ig":"st:tt",r.st);if(!ig){if(r.pic)addToList("pic:"+code,r.pic);if(r.tal)addToList("tal:"+code,r.tal)}else if(r.pic)addToList("pic:INSTAGRAM",r.pic)})});
    S.sheet.lastImport=new Date().toLocaleString("id-ID")+" · "+ymLabel(ym)+" · "+log.join(", ");
    setBusy("");touch();render();toast("Impor selesai: "+log.join(", "));
  }catch(e){setBusy("");toast(mcpMsg(e))}
}
async function backupMonth(){
  const sid=S.sheet.spreadsheetId;if(!sid){toast("Isi ID spreadsheet dulu");return}
  const ym=S.ym,tag=BULAN[+ym.slice(5)-1].slice(0,3).toUpperCase()+" "+ym.slice(0,4),n=daysIn(ym);
  const tabs=all().filter(b=>rowsOf(b.code).some(hasContent));
  if(!tabs.length){toast("Belum ada konten di "+ymLabel(ym));return}
  if(!(await confirmBox("Backup "+ymLabel(ym)+"?",`${tabs.length} tab dibuat di spreadsheet: ${tabs.map(b=>b.code+" "+tag).join(", ")}. Tab dengan nama sama diganti dengan data terbaru.`,"Backup sekarang")))return;
  const rgb=h=>{const x=parseInt(String(h).replace("#",""),16);return {red:((x>>16)&255)/255,green:((x>>8)&255)/255,blue:(x&255)/255}};
  const T=v=>{v=v==null?"":String(v);return v===""?"":"'"+v};
  try{
    setBusy("Membaca daftar tab…");
    const meta=await gs("get_spreadsheet",{spreadsheetId:sid,fields:["sheets.properties.sheetId","sheets.properties.title"]});
    const existing=(meta&&meta.sheets||[]).map(s=>s.properties||{});
    const reqs=[],fmt=[],sheets=[];
    for(const b of tabs){
      const ig=!!b.ig,cols=colsOf(b),head=cols.map(c=>c.label),title=b.code+" "+tag,id=100000+Math.floor(Math.random()*800000000);
      const ex=existing.find(s=>s.title===title);if(ex)reqs.push({deleteSheet:{sheetId:ex.sheetId}});
      const rows=[[T("CONTENT PLAN "+(ig?"INSTAGRAM":"TIKTOK")+" "+b.name)],[T(ymLabel(ym).toUpperCase())],[],head.map(T)],merges=[],sun=[];
      const all_=rowsOf(b.code).filter(hasContent);
      for(let d=1;d<=n;d++){const its=all_.filter(r=>r.d===d),wd=dow(d);
        if(!its.length){if(wd===0&&!ig){sun.push(rows.length);rows.push([T(String(d)),T("MINGGU")])}continue}
        const st=rows.length;
        its.forEach((r,ix)=>{rows.push(cols.map(col=>{const k=col.key;
          if(k==="tgl")return ix===0?T(ig?d+" "+BULAN[+ym.slice(5)-1].slice(0,3)+" "+ym.slice(0,4):String(d)):"";
          if(k==="hari")return ix===0?T(HARI[wd]):"";
          if(k==="mot")return T((r.motifs||[]).map(x=>{const m=findMotif(ig?(byCode(r.brand)||{}).code:b.code,x);return m?[m.name,m.ih&&"IH : "+m.ih,m.lv&&"LV : "+m.lv,m.af&&"AF : "+m.af,m.kl&&"KL : "+m.kl].filter(Boolean).join("\n"):x}).join("\n\n"));
          if(col.type==="check")return r[k]?"TRUE":"FALSE";
          if(k==="shot")return r.shot?T("ada (lihat dashboard)"):"";
          return T(r[k])}));
          const ri=rows.length-1;cols.forEach((col,ci)=>{const f=fmtOf(r,col.key);if(!(f.bg||f.fc||f.b||f.i||f.u))return;
            fmt.push({repeatCell:{range:{sheetId:id,startRowIndex:ri,endRowIndex:ri+1,startColumnIndex:ci,endColumnIndex:ci+1},cell:{userEnteredFormat:Object.assign(f.bg?{backgroundColor:rgb(f.bg)}:{},{textFormat:Object.assign({bold:!!f.b,italic:!!f.i,underline:!!f.u},f.fc?{foregroundColor:rgb(f.fc)}:{})})},fields:"userEnteredFormat.textFormat"+(f.bg?",userEnteredFormat.backgroundColor":"")}})})});
        if(its.length>1&&!ig){merges.push([st,rows.length,0],[st,rows.length,1])}
        if(wd===0)for(let i=st;i<rows.length;i++)sun.push(i);
      }
      reqs.push({addSheet:{properties:{sheetId:id,title,gridProperties:{rowCount:rows.length+20,columnCount:head.length,frozenRowCount:4,frozenColumnCount:2},tabColorStyle:{rgbColor:rgb(b.color)}}}});
      sheets.push({title,rows});
      const C=rgb(b.color),W={red:1,green:1,blue:1};
      fmt.push({repeatCell:{range:{sheetId:id,startRowIndex:0,endRowIndex:2,startColumnIndex:0,endColumnIndex:head.length},cell:{userEnteredFormat:{backgroundColor:C,textFormat:{bold:true,fontSize:12,foregroundColor:W}}},fields:"userEnteredFormat.backgroundColor,userEnteredFormat.textFormat"}});
      fmt.push({repeatCell:{range:{sheetId:id,startRowIndex:3,endRowIndex:4,startColumnIndex:0,endColumnIndex:head.length},cell:{userEnteredFormat:{backgroundColor:C,textFormat:{bold:true,foregroundColor:W},horizontalAlignment:"CENTER",verticalAlignment:"MIDDLE",wrapStrategy:"WRAP"}},fields:"userEnteredFormat.backgroundColor,userEnteredFormat.textFormat,userEnteredFormat.horizontalAlignment,userEnteredFormat.verticalAlignment,userEnteredFormat.wrapStrategy"}});
      fmt.push({repeatCell:{range:{sheetId:id,startRowIndex:4,endRowIndex:rows.length,startColumnIndex:0,endColumnIndex:head.length},cell:{userEnteredFormat:{wrapStrategy:"WRAP",verticalAlignment:"TOP"}},fields:"userEnteredFormat.wrapStrategy,userEnteredFormat.verticalAlignment"}});
      head.forEach((h,ci)=>fmt.push({updateDimensionProperties:{range:{sheetId:id,dimension:"COLUMNS",startIndex:ci,endIndex:ci+1},properties:{pixelSize:/SCRIPT|IDE|CAPTION|HASHTAG|MOTIF|CATATAN|REFERENSI/i.test(h)?240:/LINK/i.test(h)?170:ci<2?60:120},fields:"pixelSize"}}));
      merges.forEach(([s,e,c])=>fmt.push({mergeCells:{range:{sheetId:id,startRowIndex:s,endRowIndex:e,startColumnIndex:c,endColumnIndex:c+1},mergeType:"MERGE_ALL"}}));
      sun.forEach(r=>fmt.push({repeatCell:{range:{sheetId:id,startRowIndex:r,endRowIndex:r+1,startColumnIndex:0,endColumnIndex:2},cell:{userEnteredFormat:{textFormat:{bold:true,foregroundColor:{red:.85,green:.19,blue:.15}}}},fields:"userEnteredFormat.textFormat"}}));
    }
    setBusy("Membuat "+sheets.length+" tab…");await gs("update_spreadsheet",{spreadsheetId:sid,requests:reqs});
    let k=0;for(const s of sheets){k++;setBusy(`Menulis ${s.title} (${k}/${sheets.length})…`);await gs("update_values",{spreadsheetId:sid,range:`'${s.title}'!A1`,values:s.rows})}
    setBusy("Merapikan format…");try{for(let i=0;i<fmt.length;i+=400)await gs("update_spreadsheet",{spreadsheetId:sid,requests:fmt.slice(i,i+400)})}catch(_){}
    S.sheet.lastBackup=new Date().toLocaleString("id-ID")+" · "+sheets.map(s=>s.title).join(", ");
    setBusy("");render();toast("Backup selesai: "+sheets.length+" tab");
  }catch(e){setBusy("");toast(mcpMsg(e))}
}
function sheetCard(){const sh=S.sheet;return `<article class="card" style="display:flex;flex-direction:column;gap:12px"><div class="head" style="margin:0"><div><h2>Google Sheets</h2><p class="sub">Impor content plan ${esc(ymLabel(S.ym))} dari tab lama, atau backup ke tab baru per brand (misalnya "MTR85 ${esc(BULAN[+S.ym.slice(5)-1].slice(0,3).toUpperCase()+" "+S.ym.slice(0,4))}").</p></div></div>
  <label class="field">ID spreadsheet (bagian URL setelah /d/)<input class="cin" id="gsId" value="${esc(sh.spreadsheetId)}" style="border:1px solid var(--line);font-family:var(--mono);font-size:12px"></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn acc press" data-gs="backup">Backup ${esc(ymLabel(S.ym))} ke Google Sheets</button><button class="btn press" data-gs="import">Impor ${esc(ymLabel(S.ym))} dari Google Sheets</button>${sh.spreadsheetId?`<a class="btn" href="https://docs.google.com/spreadsheets/d/${esc(sh.spreadsheetId)}/edit" target="_blank" rel="noopener">Buka spreadsheet ↗</a>`:""}</div>
  <p class="note" id="gsProgress">${esc(S.busy||"")}</p>${sh.lastBackup?`<p class="note">Backup terakhir: ${esc(sh.lastBackup)}</p>`:""}${sh.lastImport?`<p class="note">Impor terakhir: ${esc(sh.lastImport)}</p>`:""}</article>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-gs]");if(!b)return;if(b.dataset.gs==="backup")backupMonth();else importMonth()});
document.addEventListener("change",e=>{if(e.target.id==="gsId"){S.sheet.spreadsheetId=e.target.value.trim().replace(/^.*\/d\/([^/]+).*$/,"$1");render();toast("ID spreadsheet disimpan")}});

/* ---- campaigns: name, keywords, color ---- */
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.campf){const c=S.campaigns[+t.dataset.ci];if(!c)return;c[t.dataset.campf]=t.value.trim();render()}});
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-campadd]");if(a){S.campaigns.push({name:"Campaign baru",color:CSW[S.campaigns.length%CSW.length],kw:""});render();return}
  const d=e.target.closest("[data-campdel]");if(d){S.campaigns.splice(+d.dataset.campdel,1);render()}});
/* ---- links: #beranda, #pengaturan, #b-KODE ---- */
function viewFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(h==="pengaturan")return S.ro?"beranda":"pengaturan";if(h.startsWith("b-")&&byCode(h.slice(2)))return h.slice(2);return "beranda"}
window.addEventListener("hashchange",()=>{const v=viewFromHash();if(v!==S.view){S.view=v;S.cs=null;render()}});

/* ---- start ---- */
async function boot(){
  S.view=viewFromHash();
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [DB.db,DB.user,DB.assets,DB.mcp]=await Promise.all(["db","user","assets","mcp"].map(use));
  if(DB.user&&typeof DB.user.canEdit==="function"){try{S.isOwner=await DB.user.isOwner();S.ro=!(await DB.user.canEdit())}catch(_){S.ro=false}}else S.roUnknown=true;
  applyRO();
  if(!DB.db){S.err=window.CP_CONFIG?"Server belum tersambung. Periksa config.js (API_URL).":"Buka dashboard ini di claude.ai dan masuk ke akun untuk melihat dan menyimpan content plan.";setSync("bad","Offline");S.settingsReady=true;render();return}
  setSync("wait","Memuat…");
  DB.db.doc("config/settings").onSnapshot(s=>{
    const d=s.exists?s.data():null;if(S.settingsReady&&d&&JSON.stringify(d)===lastSettings)return;
    applySettings(d);lastSettings=JSON.stringify(settingsObj());const first=!S.settingsReady;S.settingsReady=true;
    if(first&&!S.subscribed){S.subscribed=true;S.view=viewFromHash();subMonth(S.ym)}
    if(sheetBusy())S.needRender=true;else render();
  },err=>{S.err=dbErr(err);S.settingsReady=true;render()});
}
/* ---- today marker ---- */
function isToday(d){const t=new Date();return S.ym===t.getFullYear()+"-"+pad2(t.getMonth()+1)&&d===t.getDate()}
function scrollToToday(){const key=S.view+"|"+S.ym;if(S.scrolledFor===key)return;S.scrolledFor=key;
  const w=document.querySelector(".sheet-wrap"),c=document.getElementById("todayCell");if(!w||!c)return;
  const th=w.querySelector("thead");w.scrollTop=Math.max(0,c.closest("tr").offsetTop-(th?th.offsetHeight:0)-4)}
/* ---- column widths: drag the edge of a header; shared by all TikTok brands (and separately for Instagram) ---- */
S.colW={tt:{},ig:{}};
const colStyle=document.createElement("style");document.head.appendChild(colStyle);
/* fixed column widths like Google Sheets: the <colgroup> carries each width, text wraps inside */
function applyColW(){colStyle.textContent="";const w=document.querySelector(".sheet-wrap[data-kind]"),b=curB();if(!w||!b)return;const kind=w.dataset.kind,dense=w.classList.contains("dense"),cols=colsOf(b);let tot=COLRN;
  w.querySelectorAll("colgroup col[data-col]").forEach(c=>{const col=cols.find(x=>x.key===c.dataset.col);const px=col?colW(kind,col,dense):100;c.style.width=px+"px";tot+=px});
  const t=w.querySelector("table.sheet");if(t)t.style.width=tot+"px";applyFreeze()}
document.addEventListener("pointerdown",e=>{const rz=e.target.closest(".rz");if(!rz)return;e.preventDefault();e.stopPropagation();
  const th=rz.closest("th"),kind=th.closest(".sheet-wrap").dataset.kind,key=rz.dataset.rz,r0=th.getBoundingClientRect(),scale=r0.width/th.offsetWidth,x0=e.clientX;
  rz.setPointerCapture(e.pointerId);rz.classList.add("on");
  const mv=ev=>{S.colW[kind][key]=Math.round(Math.max(48,(r0.width+(ev.clientX-x0))/scale));applyColW()};
  const up=()=>{rz.removeEventListener("pointermove",mv);rz.removeEventListener("pointerup",up);rz.classList.remove("on");fitTables();toast(`Lebar kolom disimpan untuk ${kind==="tt"?"semua brand TikTok":"Instagram"}`)};
  rz.addEventListener("pointermove",mv);rz.addEventListener("pointerup",up)},true);
document.addEventListener("dblclick",e=>{const rz=e.target.closest(".rz");if(!rz)return;const kind=rz.closest(".sheet-wrap").dataset.kind;delete S.colW[kind][rz.dataset.rz];applyColW();fitTables();toast("Lebar kolom kembali ke ukuran awal")});
document.addEventListener("click",e=>{const b=e.target.closest("[data-colreset]");if(!b)return;S.colW[b.dataset.colreset]={};applyColW();fitTables();toast("Semua lebar kolom kembali ke ukuran awal")});
/* ---- font choice ---- */
const FONTS=["Plus Jakarta Sans","Poppins","Inter","Montserrat","DM Sans","Nunito"];
S.font="Plus Jakarta Sans";
function applyFont(){document.documentElement.style.setProperty("--font",`"${S.font}", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif`)}
document.addEventListener("click",e=>{const f=e.target.closest("[data-font]");if(!f)return;S.font=f.dataset.font;try{localStorage.setItem("cpig-font",S.font)}catch(_){}applyFont();render();toast("Font diganti ke "+S.font)});
/* ---- option colors from Pengaturan ---- */
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||t.dataset.optc===undefined)return;const k=t.dataset.optc;S.optColor[k]=S.optColor[k]||{};S.optColor[k][t.dataset.opt]=t.value;render();toast("Warna "+t.dataset.opt+" disimpan")});
document.addEventListener("click",e=>{const t=e.target.closest("[data-optclear]");if(!t)return;const k=t.dataset.optclear;if(S.optColor[k])delete S.optColor[k][t.dataset.opt];render()});
/* table density; "Muat layar" scales the table so every column fits the card width */
S.density="normal"; try{S.density=localStorage.getItem("cpig-density2")||"normal"}catch(_){}
function fitTables(){
  document.querySelectorAll(".sheet-wrap").forEach(w=>{
    const t=w.querySelector("table.sheet"); if(!t)return; t.style.zoom="";
    if(!w.classList.contains("fit"))return;
    const have=w.clientWidth-2; let z=1;
    for(let i=0;i<4;i++){const need=w.scrollWidth;if(need<=have+1)break;z=Math.max(.25,z*have/need);t.style.zoom=z.toFixed(3)}
  });
}
window.addEventListener("resize",()=>{clearTimeout(window.__ft);window.__ft=setTimeout(fitTables,120)});
document.addEventListener("click",e=>{const d=e.target.closest("[data-density]");if(!d)return;S.density=d.dataset.density;try{localStorage.setItem("cpig-density2",S.density)}catch(_){}const y=window.scrollY;render();window.scrollTo(0,y)});
/* zoom: Ctrl + scroll (and Ctrl + / - / 0) resizes the whole dashboard */
let zoom=1; try{zoom=+localStorage.getItem("cpig-zoom")||1}catch(_){}
function setZoom(z){zoom=Math.round(Math.min(1.6,Math.max(.6,z))*10)/10;const sh=document.querySelector(".shell");sh.style.zoom=zoom;document.documentElement.style.setProperty("--z",zoom);document.getElementById("zoomLbl").textContent=Math.round(zoom*100)+"%";try{localStorage.setItem("cpig-zoom",zoom)}catch(_){}}
window.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom+(e.deltaY<0?.1:-.1))},{passive:false});
window.addEventListener("keydown",e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key==="="||e.key==="+"){e.preventDefault();setZoom(zoom+.1)}else if(e.key==="-"){e.preventDefault();setZoom(zoom-.1)}else if(e.key==="0"){e.preventDefault();setZoom(1)}});
function setColor(id,c){
  if(id==="side"){S.sideColor=c;S.sideCustom=true} else if(id==="accent"){S.accent=c;S.accentCustom=true} else if(id==="promo")S.promo=c;
  else if(id.startsWith("camp"))S.campaigns[+id.slice(4)].color=c; else if(id.startsWith("b"))all()[+id.slice(1)].color=c;
  render();
}
/* theme */
const tb=document.querySelectorAll("[data-theme-set]");
const cur=()=>document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);tb.forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===t));try{localStorage.setItem("cpig-theme",t)}catch(_){}}
tb.forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeSet));
let saved=null;try{saved=localStorage.getItem("cpig-theme")}catch(_){}
if(saved)applyTheme(saved);else tb.forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===cur()));
if(lsGet("cpig-mini","0")==="1"){document.querySelector(".shell").classList.add("mini");const st=document.getElementById("sideTog");st.setAttribute("aria-label","Lebarkan sidebar");st.setAttribute("aria-expanded","false")}
applyFont(); applyColW(); render(); setZoom(zoom); boot();
})();
