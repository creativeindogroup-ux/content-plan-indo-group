<title>Content Plan Indo Group</title>

<style>
/* Layout: fixed sidebar (logo, Beranda, brand tabs, Instagram channels, Pengaturan + theme at the bottom)
   + sage workspace. Beranda = pending + one card per brand with its own pillar donut.
   Brand page = colored sheet table (brand header, zebra tint) followed by pending, motif, pillar, campaign, daily recap. */
:root{
  --sun:#D93025; --bg:#EEF2EF; --bg-2:#F5F7F6; --side:#FFFFFF; --side-2:#F4F7F5; --side-ink:#1E2B24; --side-muted:#7A8A82;
  --surface:#FFFFFF; --ink:#1E2B24; --muted:#6F7E77; --line:#E3E9E5; --accent:#2F6B4F; --on-accent:#FFFFFF; --accent-soft:#DDF2D6;
  --grid:#E2E5E3; --hdr:#F6F8F7; --frz:#C3CEC8;
  --ok:#2E8B57; --late:#C2452D; --warn:#B7791F;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:18px;
  --sh-card:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(30,43,36,.05), 0 10px 24px -10px rgba(30,43,36,.18);
  --sh-lift:0 1px 0 rgba(255,255,255,.9) inset, 0 4px 8px rgba(30,43,36,.07), 0 20px 36px -12px rgba(30,43,36,.24);
  --sh-press:0 1px 3px rgba(30,43,36,.2) inset;
  --sh-side:0 1px 0 #fff inset, 0 2px 4px rgba(30,43,36,.04), 0 14px 32px -14px rgba(30,43,36,.25);
  --zebra:7%; --tint:26%;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sun:#F28B82; --bg:#0E1311; --bg-2:#151C19; --side:#141B18; --side-2:#1A2320; --side-ink:#E6EEE9; --side-muted:#8D9E96;
  --surface:#18201D; --ink:#E6EEE9; --muted:#93A39C; --line:#26302C; --accent:#7FCB8F; --on-accent:#0E1F14; --accent-soft:rgba(127,203,143,.16);
  --grid:#2A3430; --hdr:#1D2622; --frz:#3A4741;
  --ok:#5CC48A; --late:#F07B63; --warn:#E8B04E;
  --sh-card:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 4px rgba(0,0,0,.35), 0 14px 30px -10px rgba(0,0,0,.6);
  --sh-lift:0 1px 0 rgba(255,255,255,.05) inset, 0 4px 10px rgba(0,0,0,.4), 0 24px 44px -14px rgba(0,0,0,.75);
  --sh-press:0 2px 4px rgba(0,0,0,.5) inset; --sh-side:8px 0 30px -10px rgba(0,0,0,.7);
  --zebra:12%; --tint:30%; color-scheme:dark; } }
:root[data-theme="dark"]{
  --sun:#F28B82; --bg:#0E1311; --bg-2:#151C19; --side:#141B18; --side-2:#1A2320; --side-ink:#E6EEE9; --side-muted:#8D9E96;
  --surface:#18201D; --ink:#E6EEE9; --muted:#93A39C; --line:#26302C; --accent:#7FCB8F; --on-accent:#0E1F14; --accent-soft:rgba(127,203,143,.16);
  --grid:#2A3430; --hdr:#1D2622; --frz:#3A4741;
  --ok:#5CC48A; --late:#F07B63; --warn:#E8B04E;
  --sh-card:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 4px rgba(0,0,0,.35), 0 14px 30px -10px rgba(0,0,0,.6);
  --sh-lift:0 1px 0 rgba(255,255,255,.05) inset, 0 4px 10px rgba(0,0,0,.4), 0 24px 44px -14px rgba(0,0,0,.75);
  --sh-press:0 2px 4px rgba(0,0,0,.5) inset; --sh-side:8px 0 30px -10px rgba(0,0,0,.7);
  --zebra:12%; --tint:30%; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);border-radius:22px;border:1px solid var(--line);box-shadow:var(--sh-side);display:flex;flex-direction:column;overflow:hidden;position:sticky;top:18px;height:calc((100vh - 36px) / var(--z,1))}
.logo{padding:16px 14px 14px;display:flex;align-items:center;gap:10px;background:var(--side-2);border-radius:0 0 18px 18px;border-bottom:1px solid var(--line)}
.logo .mark{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.logo .mark img{width:100%;height:100%;object-fit:contain}
.logo .mark span{font-weight:800;font-size:12px;color:var(--side);letter-spacing:.02em}
.logo b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;line-height:1.25}
.logo small{color:var(--side-muted);font-size:11px}
.side-scroll{flex:1;overflow:auto;padding:14px 0;display:flex;flex-direction:column;gap:4px}
.side h3{margin:12px 0 4px;padding:0 22px;font-size:9.5px;letter-spacing:.14em;color:var(--side-muted);font-weight:800;text-transform:uppercase}
.navb{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-ink);padding:8px 12px;margin:0 10px;border-radius:12px;text-align:left;font-weight:600;font-size:12px;transition:transform .12s, background .2s, box-shadow .2s}
.navb:hover{background:color-mix(in srgb,var(--side-ink) 6%,transparent)}
.navb:active{transform:scale(.96)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:var(--sh-card)}
.navb svg{width:18px;height:18px;stroke:var(--side-muted);fill:none;stroke-width:1.8;flex:none}
.navb[aria-current="page"] svg{stroke:var(--accent)}
.navb .dot{width:24px;height:24px;border-radius:7px;background:var(--c);display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800;flex:none;box-shadow:0 3px 8px -2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25)}
.navb .nm{flex:1;min-width:0}
.navb .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb .nm small{display:block;font-size:10.5px;font-weight:600;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb[aria-current="page"] .nm small{color:var(--muted)}
.navb .ct{font-size:10.5px;font-weight:700;color:var(--side-muted);background:color-mix(in srgb,var(--side-ink) 6%,transparent);border-radius:999px;padding:1px 7px}
.side-foot{padding:12px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot .navb{margin:0;border-radius:14px;padding:9px 12px}
.theme{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--side-ink) 7%,transparent);border-radius:999px;padding:4px}
.theme button{border:0;background:transparent;border-radius:999px;padding:7px 8px;font-weight:700;font-size:12px;color:var(--side-muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.theme button:active{transform:scale(.94)}
.theme button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 10px -3px rgba(0,0,0,.4)}

/* main */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.01em;flex:1;min-width:220px;text-wrap:balance}
.top h1 small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.tag{display:inline-flex;align-items:center;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.04em;box-shadow:var(--sh-card)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-card);padding:20px;transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s;min-width:0}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh-lift)}
.press{cursor:pointer;user-select:none}
.press:active,.press.pressed{transform:translateY(1px) scale(.975)!important;box-shadow:var(--sh-press)!important}
.card h2{margin:0;font-size:14.5px;font-weight:800}
.sub{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:0;background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12px;box-shadow:var(--sh-card);display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:11.5px}

/* pending */
.pending{border-left:5px solid var(--late)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--late) 7%,var(--surface));font-size:12.5px}
.prow .g{flex:1;min-width:150px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 3px;font-size:11.5px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,var(--surface));white-space:nowrap}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-block}
.st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.late{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.st.done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.st.prog{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

/* beranda brand cards */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.bc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.bc::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.bch{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:none;box-shadow:0 6px 14px -6px var(--c), inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.bch b{display:block;font-size:13px}
.bch small{color:var(--muted);font-size:11.5px}
.bcb{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nums div{background:var(--bg-2);border-radius:12px;padding:7px 9px;font-size:10.5px;color:var(--muted);font-weight:600}
.nums b{display:block;font-size:15.5px;color:var(--ink);font-weight:800}
.nums .late b{color:var(--late)}
.mini-leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--muted)}
.mini-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}

/* brand page */
/* clean look: white surfaces, brand color only as a thin tint, text and accent lines */
.band{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--ink);border-radius:var(--r);padding:18px 20px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 13%,var(--surface)),var(--surface) 70%);box-shadow:var(--sh-card);border-left:6px solid var(--c)}
.band .av{width:56px;height:56px;border-radius:16px}
.band .tt{flex:1;min-width:220px}
.band .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.band h2{margin:2px 0;font-size:18px;font-weight:800;letter-spacing:.02em;color:color-mix(in srgb,var(--c) 85%,var(--ink))}
.band .meta{color:var(--muted);font-size:12.5px;font-weight:600}
.band .pics{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.band .pics span{background:color-mix(in srgb,var(--c) 12%,var(--surface));color:color-mix(in srgb,var(--c) 80%,var(--ink));border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
.kp{display:flex;gap:10px}
.kp div{background:var(--surface);border-radius:14px;padding:8px 12px;font-size:10.5px;font-weight:600;min-width:74px;color:var(--muted);box-shadow:var(--sh-card)}
.kp b{display:block;font-size:17px;font-weight:800;color:color-mix(in srgb,var(--c) 85%,var(--ink))}

.sheet-wrap{overflow:auto;border-radius:18px;box-shadow:var(--sh-card);background:var(--surface);max-height:calc((100vh - 76px) / var(--z,1));border:1px solid color-mix(in srgb,var(--c) 14%,var(--line))}
table.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.sheet th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--c) 11%,var(--surface));color:color-mix(in srgb,var(--c) 82%,var(--ink));font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:11px 8px;white-space:nowrap;border-right:1px solid color-mix(in srgb,var(--c) 12%,var(--line));border-bottom:2px solid color-mix(in srgb,var(--c) 45%,transparent);text-align:center}
.sheet td{padding:4px 5px;border-bottom:1px solid color-mix(in srgb,var(--c) 9%,var(--line));border-right:1px solid color-mix(in srgb,var(--c) 7%,var(--line));vertical-align:top;background:var(--rowbg,var(--surface))}
/* day colors: one color per date (all its rows), alternating white / brand tint; Sunday red */
.sheet td.tgl{font-weight:800;text-align:center;vertical-align:middle;min-width:50px;color:color-mix(in srgb,var(--c) 85%,var(--ink));background:var(--surface)}
.sheet td.hari{font-weight:700;vertical-align:middle;min-width:72px;background:var(--surface)}
.sheet tr.minggu td{background:color-mix(in srgb,var(--sun) 10%,var(--surface));color:var(--sun);font-weight:800}
.sheet tr.camp td.s2,.sheet tr.promo td.s2{box-shadow:inset 5px 0 0 var(--stripe),6px 0 8px -6px rgba(0,0,0,.25)}
.sheet tr.camp{--stripe:var(--cc)} .sheet tr.promo{--stripe:var(--promo)}
.sheet tr.camp td:not(.tgl):not(.hari):not(.s2):first-of-type{box-shadow:inset 5px 0 0 var(--stripe)}
.cin{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;width:100%;font-size:12.5px;color:var(--ink)}
.cin:hover{border-color:var(--line);background:var(--surface)}
.cin:focus{border-color:var(--c);background:var(--surface);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
select.cin{font-weight:700;min-width:118px;cursor:pointer}
textarea.cin{resize:vertical;min-height:54px;display:block}
.w-txt{min-width:220px} .w-scr{min-width:300px} .w-mot{min-width:230px}
.motif{font-size:12px;line-height:1.35;padding:4px 6px}
.motif small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bdot{display:inline-flex;align-items:center;gap:6px}
.bdot i{width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}
.bdot select.cin{min-width:200px}
/* table density: Normal / Ringkas / Muat layar */
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.tbar .hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--sh-card)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--muted);transition:transform .12s}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 8px -3px rgba(0,0,0,.35)}
.sheet-wrap.dense .sheet{font-size:11px}
.sheet-wrap.dense .sheet th{font-size:9.5px;padding:7px 5px;letter-spacing:.02em}
.sheet-wrap.dense .sheet td{padding:2px 3px}
.sheet-wrap.dense .sheet td.tgl{min-width:40px}
.sheet-wrap.dense .cin{padding:3px 4px;font-size:11px}
.sheet-wrap.dense select.cin{min-width:82px;font-size:11px}
.sheet-wrap.dense textarea.cin{min-height:28px;height:28px;resize:vertical}
.sheet-wrap.dense .w-txt{min-width:130px}
.sheet-wrap.dense .w-scr{min-width:180px}
.sheet-wrap.dense .w-mot{min-width:140px}
.sheet-wrap.dense .motif{padding:2px 3px;font-size:11px}
.sheet-wrap.dense .motif small{font-size:9px}
.sheet-wrap.dense td.w-link{min-width:100px}
.sheet-wrap.dense td.shot{min-width:64px}
.sheet-wrap.dense .camp-tag{font-size:9px;padding:0 4px}
.sheet-wrap.dense td.ctr input{width:14px;height:14px}
.sheet-wrap.dense .s0{min-width:40px;width:40px}
.sheet-wrap.dense .s1{left:40px;min-width:58px;width:58px}
.sheet-wrap.dense .s2{left:98px;min-width:120px;width:120px}
.sheet-wrap.dense td.s2:has(.bdot){min-width:150px;width:150px}
.sheet-wrap.dense .bdot select.cin{min-width:126px}
.sheet-wrap.dense .btn.sm{padding:3px 7px;font-size:10.5px}
.sheet-wrap.fit{overflow-x:hidden}
.rtools{display:flex;align-items:center;gap:1px;margin-top:3px;opacity:.5;transition:opacity .15s}
.sheet tr:hover .rtools,.sheet tr.picked .rtools,.rtools:focus-within{opacity:1}
.rtools button{border:0;background:transparent;width:22px;height:20px;border-radius:5px;font-size:12px;color:var(--muted);transition:transform .1s}
.rtools button:hover{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.rtools button:active{transform:scale(.85)}
.rtools input{width:14px;height:14px;margin:0 4px 0 2px;accent-color:var(--c)}
.sheet-wrap.dense .rtools button{width:18px;height:17px;font-size:10.5px}
.sheet tr.active td:not(.tgl):not(.hari){box-shadow:inset 0 1px 0 color-mix(in srgb,var(--c) 55%,transparent),inset 0 -1px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.sheet tr.clipped td:not(.tgl):not(.hari){outline:2px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:-2px}
.sheet tr.clipped.cut td:not(.tgl):not(.hari){opacity:.6}
.rtools button.hot{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink)}
.rtools .pastehere{width:auto;padding:0 8px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink)}
.sheet tr.ghost .rtools{opacity:1}
.clipbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-radius:14px;padding:9px 14px;font-size:12.5px;box-shadow:var(--sh-card)}
.clipbar span{flex:1;min-width:220px;color:var(--muted)}
.toast{display:flex;align-items:center;gap:12px}
.toast .tact{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 12px;font-weight:800;font-size:12px}
.guide{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:10px 16px}
.guide summary{cursor:pointer;font-weight:800;font-size:13px;list-style:revert}
.gsteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.gsteps div{background:var(--bg-2);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;color:var(--muted)}
.gsteps b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:3px}
/* option colors, resizer, today, alternating dates, recaps, fonts */
select.cin.oc{background:color-mix(in srgb,var(--oc) 15%,var(--surface));color:color-mix(in srgb,var(--oc) 72%,var(--ink));box-shadow:inset 3px 0 0 var(--oc)}
.sheet th{position:sticky}
.sheet th .rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
.sheet th .rz::after{content:"";position:absolute;top:22%;bottom:22%;left:4px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--c) 30%,transparent);opacity:0;transition:opacity .15s}
.sheet th:hover .rz::after,.sheet th .rz.on::after{opacity:1}
.sheet th .rz.on::after{background:var(--c);top:0;bottom:0}
.sheet tr.alt{--rowbg:color-mix(in srgb,var(--c) 15%,var(--surface))}
.sheet tr.alt td.tgl,.sheet tr.alt td.hari{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.sheet tr.sun{--rowbg:color-mix(in srgb,var(--sun) 9%,var(--surface))}
.sheet tr.sun td.tgl,.sheet tr.sun td.hari{background:color-mix(in srgb,var(--sun) 20%,var(--surface));color:var(--sun)}
.sheet tr:not(.ghost) td{border-top-color:transparent}
.sheet tr.daystart td{border-top:2px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.sheet td.tgl.today,.sheet td.hari.today{background:var(--accent)!important;color:var(--on-accent)!important}
.sheet td.tgl.today small{display:block;font-size:8.5px;font-weight:800;letter-spacing:.06em;margin-top:2px}
.kkbar{display:flex;border-radius:10px;overflow:hidden;font-size:11.5px;font-weight:600;margin-bottom:10px;box-shadow:var(--sh-card)}
.kkbar span{padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kkbar .kk{background:#F2C94C;color:#3a2e00}
.kkbar .nk{background:var(--bg-2);color:var(--muted)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
table.mini th{font-size:10.5px;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1.5px solid var(--line);font-weight:800}
table.mini td{padding:6px 6px;border-bottom:1px solid var(--line)}
table.mini .n{text-align:right;font-variant-numeric:tabular-nums}
table.mini td.kkc{color:#9a7400;font-weight:800}
table.mini tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.mpbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mpb{display:flex;flex-direction:column;gap:4px}
.mrow2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 2px;border-bottom:1px dashed var(--line)}
.chips span.hasc{background:color-mix(in srgb,var(--oc) 16%,var(--surface));box-shadow:inset 3px 0 0 var(--oc)}
.chips .optc{width:18px;height:18px;border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fonts button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.fonts button span{font-size:11.5px;color:var(--muted)}
.fonts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
/* sync status, jump highlight, screenshot */
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--side-muted);padding:0 6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#E8B04E;flex:none}
.sync.ok i{background:#5CC48A}.sync.bad i{background:#F07B63}
.sheet tr.flash td{animation:flash 2s ease-out}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--accent) 35%,transparent)}100%{box-shadow:none}}
.sheet td.shot{position:relative}
.sheet td.shot .thumb{padding:0;background:none}
.sheet td.shot .thumb img{width:56px;height:56px}
.shotx{position:absolute;top:2px;right:2px;border:0;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:10px;box-shadow:var(--sh-card);opacity:0}
.sheet td.shot:hover .shotx{opacity:1}
.campf{border-bottom:1px dashed var(--line);padding-bottom:8px}
/* format toolbar + cell formats */
.tzone{display:flex;flex-direction:column;gap:8px}
.fmtbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:6px 8px;box-shadow:var(--sh-card);position:sticky;top:6px;z-index:8}
.fmtbar .flabel{font-size:11.5px;color:var(--muted);font-weight:700;padding:0 8px 0 4px;min-width:150px}
.fmtbar.on .flabel{color:var(--ink)}
.fmtbar button{border:0;background:transparent;min-width:30px;height:30px;border-radius:8px;font-size:14px;color:var(--ink);display:inline-grid;place-items:center;transition:transform .1s}
.fmtbar button svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.fmtbar button:hover{background:var(--bg-2)}
.fmtbar button:active{transform:scale(.9)}
.fmtbar button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.fmtbar:not(.on) button,.fmtbar:not(.on) .fc{opacity:.45}
.fmtbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.fmtbar .fc{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:800;font-size:14px;line-height:1}
.fmtbar .fc:hover{background:var(--bg-2)}
.fmtbar .fc i{display:block;width:16px;height:3px;border-radius:2px;background:var(--ink);margin-top:1px}
.fmtbar .fc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sheet td[data-b] .cin{font-weight:800!important}
.sheet td[data-i] .cin{font-style:italic}
.sheet td[data-u] .cin{text-decoration:underline}
.sheet td[data-ta="left"] .cin{text-align:left;text-align-last:left}
.sheet td[data-ta="center"] .cin{text-align:center;text-align-last:center}
.sheet td[data-ta="right"] .cin{text-align:right;text-align-last:right}
.sheet td[data-fc] .cin{color:var(--fc)!important}
/* motif cell + library */
.mcell{display:flex;flex-direction:column;gap:3px;min-width:200px}
.mslot{display:flex;flex-direction:column}
.mslot+.mslot{border-top:1px dashed var(--line);padding-top:3px}
.cin.min{font-weight:700}
.cin.min::placeholder{font-weight:500;color:var(--muted)}
.pid{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pid.ok{color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.pid.miss{color:var(--late);font-family:var(--font);white-space:normal}
.pids{display:flex;flex-wrap:wrap;gap:3px;padding:2px 6px 3px}
.pidc{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--bg-2);border-radius:6px;padding:1px 6px 1px 3px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pidc b{font-family:var(--font);font-size:9.5px;font-weight:800}
.pidc input{width:12px;height:12px;margin:0;accent-color:var(--ok);flex:none;pointer-events:auto}
.pidc.on{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:color-mix(in srgb,var(--ok) 85%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
body.ro .pidc input{pointer-events:none}
.addmot{border:0;background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:800;margin-left:4px;cursor:pointer}
.sheet-wrap.dense .pid{font-size:9px}
table.mlib th{position:sticky;top:0}
table.mlib td{padding:3px 4px}
.icon-del{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px}
.icon-del:hover{background:color-mix(in srgb,var(--late) 12%,transparent);color:var(--late)}
.mlpaste{margin-top:12px}
.mlpaste summary{cursor:pointer;font-weight:800;font-size:13px}
.mlpaste textarea{width:100%;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);margin-top:6px}
.sheet tr.picked{--rowbg:color-mix(in srgb,var(--accent) 18%,var(--surface))!important}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:9px 12px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh-lift);max-width:calc(100% - 32px);font-size:12.5px}
.selbar .btn{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bg) 35%,transparent)}
.selbar select{border-radius:8px;border:0;padding:4px 6px;margin-left:4px;color:var(--ink);background:var(--surface)}
.sheet td.s2:has(.bdot){min-width:230px;width:230px}
tr.ghost td:not(.tgl):not(.hari){opacity:.75}
.sheet .stk{position:sticky;z-index:1}
.sheet th.stk{z-index:4}
.sheet .s0{left:0;min-width:54px;width:54px}
.sheet .s1{left:54px;min-width:78px;width:78px}
.sheet .s2{left:132px;min-width:168px;width:168px;box-shadow:6px 0 8px -6px rgba(0,0,0,.25)}
.sheet td.s2{background:var(--rowbg,var(--surface))}
/* modal, toast, month switch, zoom */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.4);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--sh-lift);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:16px}
.modal input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:12.5px;box-shadow:var(--sh-lift)}
.month{display:flex;align-items:center;gap:2px;margin-top:6px;background:color-mix(in srgb,var(--side-ink) 7%,transparent);border-radius:999px;padding:2px}
.month button{border:0;background:transparent;color:var(--side-ink);width:24px;height:24px;border-radius:999px;font-size:15px;line-height:1;transition:transform .12s}
.month button:hover{background:color-mix(in srgb,var(--side-ink) 12%,transparent)}
.month button:active{transform:scale(.88)}
.month span{flex:1;text-align:center;font-size:11.5px;font-weight:800;white-space:nowrap}
.zoom{display:flex;align-items:center;justify-content:space-between;gap:4px;background:color-mix(in srgb,var(--side-ink) 7%,transparent);border-radius:999px;padding:3px}
.zoom button{border:0;background:transparent;color:var(--side-ink);min-width:28px;height:26px;border-radius:999px;font-weight:800;font-size:13px;transition:transform .12s}
.zoom button:hover{background:color-mix(in srgb,var(--side-ink) 12%,transparent)}
.zoom button:active{transform:scale(.9)}
.zoom .zv{font-size:11.5px;min-width:54px}
.empty{text-align:center;padding:40px 20px}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto;max-width:520px}
.sheet td.ctr{text-align:center;vertical-align:middle}
.sheet td.ctr input{width:17px;height:17px;accent-color:var(--c)}
.sheet td.w-link{min-width:170px;white-space:nowrap}
.sheet td.w-link .cin{display:inline-block;width:calc(100% - 20px)}
.sheet .lk{text-decoration:none;font-weight:800;color:var(--c)}
.sheet td.shot{min-width:96px;text-align:center;vertical-align:middle}
.thumb{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.thumb img{display:block;width:72px;height:72px;object-fit:cover;border-radius:8px}
select.st-done{color:var(--ok)} select.st-prog{color:var(--warn)}
.camp-tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;margin:2px 0 0 4px;border-radius:999px;background:color-mix(in srgb,var(--stripe,var(--accent)) 45%,var(--surface));color:var(--ink)}

.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.hb{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 30px;gap:10px;align-items:center;padding:4px 0;font-size:12.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:9px;border-radius:999px;background:var(--bg-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.track span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.hb b{text-align:right}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(0,0,0,.12);background:var(--sw);padding:0;transition:transform .12s}
.pal button:active{transform:scale(.85)}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pal input[type=color]{width:34px;height:26px;border:0;padding:0;background:transparent;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;gap:4px;background:var(--bg-2);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;font-weight:700;color:var(--ink)}
.chips span button{border:0;background:transparent;color:var(--muted);padding:0 5px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--surface)}
.scard{border-top:6px solid var(--c);display:flex;flex-direction:column;gap:12px}
.uplogo{display:flex;align-items:center;gap:14px}
.uplogo .mark{width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:var(--sh-card);font-weight:800;color:#3D5A50;font-size:12px}
.uplogo .mark img{width:100%;height:100%;object-fit:contain}
.note{font-size:12px;color:var(--muted);margin:0}

/* ---- spreadsheet selection, menus, filters ---- */
[hidden]{display:none!important}
.sheet-wrap:focus{outline:none}
.sheet thead th[data-col]{cursor:pointer;user-select:none}
.sheet td[data-bg]{background:var(--cbg)!important}
.sheet td[data-bg] .cin:not(:focus),.sheet td[data-bg] select.cin.oc{background:transparent}
.fmtbar .fcb,.mfmt .fcb{display:inline-flex!important;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;line-height:1}
.fcb i{display:block;width:16px;height:3px;border-radius:2px;margin-top:1px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.fcb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round}
.cpal{position:fixed;z-index:72;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--sh-lift),0 0 0 1px var(--line);padding:6px 0 8px;width:268px;max-height:calc(100vh - 16px);overflow:auto;font-size:13px}
.cpal .pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:2px 14px 6px}
.cpal .pgrid button{width:20px;height:20px;border-radius:50%;border:0;padding:0;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);cursor:pointer;transition:transform .1s}
.cpal .pgrid button:hover,.cpal .pgrid button:focus{transform:scale(1.18);outline:none}
.cpal .pgrid button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #1a73e8}
.cpal .pnone{display:block;width:calc(100% - 28px);margin:2px 14px 8px;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:8px;padding:6px;font-size:12px;font-weight:700;cursor:pointer}
.cpal .pnone:hover{background:var(--bg-2)}
.cpal .plbl{display:block;padding:4px 14px 3px;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cpal .pcust{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0;font-size:12px;font-weight:700;cursor:pointer}
.cpal .pcust input{width:38px;height:26px;border:0;padding:0;background:transparent;cursor:pointer}
.sheet td.csel{background:color-mix(in srgb,#4285f4 24%,var(--rowbg,var(--surface)))!important}
.sheet td.csel .cin{background:transparent}
.sheet td.cfocus{box-shadow:inset 0 0 0 2px #1a73e8}
.sheet td.cclip{outline:1.5px dashed #1a73e8;outline-offset:-4px}
.sheet th.chsel{background:color-mix(in srgb,#1a73e8 18%,var(--surface))!important;color:var(--ink)}
body.dragsel,body.dragsel *{user-select:none!important;cursor:cell!important}
.fbtn{border:0;background:transparent;margin-left:4px;width:18px;height:18px;border-radius:5px;font-size:11px;line-height:1;color:inherit;vertical-align:middle;cursor:pointer}
.fbtn:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.fbtn.on{background:#1a73e8;color:#fff}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:8px 12px;box-shadow:var(--sh-card);font-size:12.5px}
.fchip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,#1a73e8 13%,var(--surface));border-radius:999px;padding:3px 4px 3px 10px;font-weight:700;font-size:12px}
.fchip button{border:0;background:transparent;width:20px;height:20px;border-radius:50%;color:inherit;cursor:pointer}
.fchip button:hover{background:rgba(0,0,0,.08)}
.sheet td.nores{text-align:center;padding:28px!important;color:var(--muted)}
.sheet td:has(.notetri,.celllink):not(.stk){position:relative}
.notetri{position:absolute;top:0;right:0;width:0;height:0;border-top:8px solid #E8A33D;border-left:8px solid transparent;pointer-events:none}
.celllink{position:absolute;bottom:2px;right:3px;font-size:11px;font-weight:800;color:#1a73e8;text-decoration:none;background:var(--surface);border-radius:4px;padding:0 4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cmenu,.fpop{position:fixed;z-index:70;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--sh-lift),0 0 0 1px var(--line);padding:6px 0;min-width:260px;max-height:calc(100vh - 16px);overflow:auto;font-size:13px}
.cmenu>button[data-cm],.cmenu .msub button[data-cm]{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;border:0;background:transparent;padding:6px 16px;text-align:left;color:inherit;font-size:13px;cursor:pointer}
.cmenu>button[data-cm]:hover,.cmenu>button[data-cm]:focus,.cmenu .msub button[data-cm]:hover,.cmenu .msub button[data-cm]:focus{background:var(--bg-2);outline:none}
.cmenu button[disabled]{opacity:.4;cursor:default}
.cmenu kbd{font-family:inherit;font-size:11.5px;color:var(--muted)}
.cmenu small,.mhead small{color:var(--muted);font-weight:500}
.cmenu hr,.fpop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.cmenu .msub>span,.mfmt>span{display:block;padding:6px 16px 2px;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.cmenu .msub button[data-cm]{padding-left:28px}
.mhead{padding:6px 16px;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;gap:12px}
.mfmt{padding:2px 0 4px}
.mfmt>div{display:flex;gap:2px;align-items:center;flex-wrap:wrap;padding:0 12px}
.mfmt button{border:0;background:transparent;min-width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:inherit;font-size:14px;cursor:pointer}
.mfmt button:hover,.mfmt button:focus{background:var(--bg-2);outline:none}
.mfmt button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.mfmt button svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}

const BASE_IG=[["Tanggal","tgl","tgl"],["Hari","hari","hari"],["Minggu","week","dropdown","minggu"],["Brand","brand","brand"],["Slot","slot","text"],["Jam Tayang","jam","text"],["Tipe","tipe","dropdown","tipe"],["Format","format","dropdown","format"],["Pilar","pil","dropdown","pil:ig"],["PIC","pic","dropdown","pic:@"],["Product ID","pid","text"],["Motif","mot","motif"],["Referensi Konten (opsional)","ref","link"],["Ide / Konsep","ide","long"],["Hook (Opsional)","hook","text"],["Judul","judul","text"],["CTA (Opsional)","cta","text"],["Hashtag","tag","text"],["IG","c_ig","check"],["TikTok","c_tt","check"],["YouTube","c_yt","check"],["Status Upload","st","dropdown","st:ig"],["Link Konten","link","link"],["Catatan","note","long"]];
const mkCol=a=>({key:a[1],label:a[0],type:a[2],list:a[3]||""});
S.cols={};S.frz={};
function colsOf(b){return S.cols[b.code]||(S.cols[b.code]=(b.ig?BASE_IG:BASE_TT).map(mkCol))}
function colList(col,b){return String(col.list||"").replace("@",b.code)}
function colLabel(key){const b=byCode(S.view);const c=b&&colsOf(b).find(x=>x.key===key);return c?c.label:key}
const COLS_TT=BASE_TT.map(a=>[a[0],a[1]]),COLS_IG=BASE_IG.map(a=>[a[0],a[1]]);
const CHECK=new Set(["kerkun","c_ig","c_tt","c_yt","c_sh"]);
const LINKS=new Set(["gdrive","tiktok","shopee","youtube","facebook","link","ref"]);
const WIDE=new Set(["scr","cap","ide","note"]);
const TYPE_LABEL={text:"Teks",long:"Teks panjang",dropdown:"Dropdown",check:"Centang",link:"Link",number:"Angka",date:"Tanggal",motif:"Motif + PID",shot:"Screenshot",brand:"Brand"};

/* ---- cell text in / out (used by copy, paste, filter, sort) ---- */
function cellText(r,col){if(!r)return "";const v=r[col.key];
  if(col.type==="check")return v?"TRUE":"FALSE";
  if(col.type==="motif")return (r.motifs||[]).join(", ");
  if(col.type==="shot")return r.shot?"(screenshot)":"";
  return v==null?"":String(v)}
function setCellText(r,col,txt,b){txt=String(txt??"");
  if(col.type==="check"){r[col.key]=/^(true|ya|yes|1|✓|v|x)$/i.test(txt.trim());return}
  if(col.type==="motif"){const br=b.ig?byCode(r.brand):b;r.motifs=txt.split(/\n|,|;/).map(s=>s.trim()).filter(Boolean).slice(0,3).map(n=>{const m=br&&findMotif(br.code,n);return m?m.name:n});return}
  if(col.type==="shot")return;
  if(col.type==="brand"){const bb=brandFromText(txt)||S.brands.find(x=>x.name.toLowerCase()===txt.trim().toLowerCase());r.brand=bb?bb.name:txt.trim();return}
  if(col.type==="date"){const t=txt.trim();const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);r[col.key]=m?m[3]+"-"+pad2(+m[2])+"-"+pad2(+m[1]):t;return}
  r[col.key]=(col.type==="long"||col.type==="text")?txt:txt.replace(/\n/g," ");
}
function clearCell(r,col){if(col.type==="check")r[col.key]=false;else if(col.type==="motif")r.motifs=[];else if(col.type==="shot")r.shot="";else r[col.key]="";if(r.fmt)delete r.fmt[col.key];if(r.notes)delete r.notes[col.key];if(r.lk)delete r.lk[col.key]}

/* ---- filters: per column like Google Sheets; for me only (this browser) or for the whole team ---- */
S.pf={};S.sharedFilters={};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(_){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
function filterScope(code){return S.ro?"me":lsGet("cpig-fs-"+code,"me")}
/* ---- access: only Editors (invited by email in the Share menu) and the owner change anything; everyone else reads ---- */
S.ro=false;
function canWrite(){if(S.ro){toast("Mode baca saja. Hanya editor yang bisa mengubah content plan.");return false}return true}
function applyRO(){document.body.classList.toggle("ro",!!S.ro);if(S.ro&&S.view==="pengaturan"){S.view="beranda";history.replaceState(null,"","#beranda")}}
function filterOn(code){return lsGet("cpig-fon-"+code,"0")==="1"}
function activeFilters(code){if(filterScope(code)==="all")return S.sharedFilters[code]||{};if(!S.pf[code]){try{S.pf[code]=JSON.parse(lsGet("cpig-f-"+code,"{}"))}catch(_){S.pf[code]={}}}return S.pf[code]}
function setFilters(code,f){if(filterScope(code)==="all")S.sharedFilters[code]=f;else{S.pf[code]=f;lsSet("cpig-f-"+code,JSON.stringify(f))}}
function filterVals(r,col){if(col.type==="motif")return (r.motifs&&r.motifs.length)?r.motifs:["(Kosong)"];if(col.type==="check")return [r[col.key]?"✓ Dicentang":"Tidak dicentang"];const t=cellText(r,col);return [t.trim()?t:"(Kosong)"]}
function passFilter(r,flt,cols){for(const [k,allowed] of Object.entries(flt)){const col=cols.find(c=>c.key===k);if(!col)continue;if(!filterVals(r,col).some(x=>allowed.includes(x)))return false}return true}

function cellHtml(col,v,ctx){
  const key=col.key,val=v[key]??"",F=`data-f="${key}"`,b=ctx.b;let cls=ctx.frz&&ctx.frz.has(key)?"stk":"",inner;
  /* text cells are wrapping text areas: the row grows to fit a long script, like "Wrap" in Google Sheets; a value starting with = is a formula */
  const TA=(extra,c2)=>{const raw=String(val),fm=isFml(raw),disp=fm?fmlDisplay(raw):raw;if(fm)S.hasF=true;
    return `<textarea class="cin ${c2||""}" ${F} rows="1" spellcheck="false" ${extra||""} ${fm?`data-raw="${esc(raw)}" data-disp="${esc(disp)}"`:""} aria-label="${esc(col.label)}">${esc(disp)}</textarea>`};
  switch(col.type){
    case "check":cls+=" ctr";inner=`<input type="checkbox" ${F} ${val?"checked":""} aria-label="${esc(col.label)}">`;break;
    case "dropdown":inner=selHtml(colList(col,b),val,key==="st"?"st-"+stClass(val):"",key)+(key==="pil"&&ctx.tag?`<span class="camp-tag">${esc(ctx.tag)}</span>`:"");break;
    case "brand":{const br=byCode(val);inner=`<span class="bdot" style="--bc:${br?br.color:"var(--line)"}"><i></i>${selHtml("brand",val,"",key)}</span>`;break}
    case "motif":cls+=" w-mot";inner=motifCell(v,byCode(v.brand)||(b.ig?null:b));break;
    case "shot":cls+=" shot";inner=v.shot?`<a class="thumb" href="${esc(blobUrl(v.shot))}" target="_blank" rel="noopener" title="Buka screenshot"><img src="${esc(blobUrl(v.shot))}" alt="Screenshot"></a><button class="shotx" data-shotdel title="Hapus screenshot" aria-label="Hapus screenshot">✕</button>`:v.id?`<label class="btn sm press">Upload<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-shot hidden></label>`:"";break;
    case "link":cls+=" w-link";inner=TA()+(/^https?:/.test(val)?`<a href="${esc(val)}" target="_blank" rel="noopener" class="lk" aria-label="Buka link">↗</a>`:"");break;
    case "long":cls+=key==="scr"?" w-scr":" w-txt";inner=TA();break;
    case "number":inner=TA('inputmode="decimal"',"num");break;
    case "date":inner=`<input class="cin" type="date" ${F} value="${esc(val)}" aria-label="${esc(col.label)}">`;break;
    default:inner=TA();
  }
  const note=v.notes&&v.notes[key],lk=v.lk&&v.lk[key];
  return `<td data-col="${key}" data-k="${key}" class="${cls}" ${ctx.span||""} ${fmtAttr(v,key)} ${note?`title="Catatan: ${esc(note)}"`:""}>${inner}${lk?`<a class="celllink" href="${esc(lk)}" target="_blank" rel="noopener" title="${esc(lk)}" aria-label="Buka link sel">↗</a>`:""}${note?`<i class="notetri" aria-hidden="true"></i>`:""}</td>`;
}
/* MOTIF cell: type a motif, suggestions come from that brand's list; a match shows its PIDs. Up to 3 motifs per content. */
function motifCell(v,br){
  const ms=(v.motifs||[]).filter(Boolean).slice(0,3), show=ms.length<3?[...ms,""]:ms, list=br?"ml-"+br.code:"ml-ALL";
  return `<div class="mcell">${show.map((name,i)=>{
    const m=br&&name?findMotif(br.code,name):null;
    const pid=m?[m.ih&&"IH "+m.ih,m.lv&&"LV "+m.lv,m.af&&"AF "+m.af,m.kl&&"KL "+m.kl].filter(Boolean).join(" · "):"";
    const use=(v.pidUse&&v.pidUse[m?m.name:""])||[];
    const info=!name?"":m?(pid?`<div class="pids" title="Centang PID yang dipakai untuk konten ini">${["ih","lv","af","kl"].filter(k=>m[k]).map(k=>{const on=use.includes(k);return `<label class="pidc ${on?"on":""}"><input type="checkbox" data-pidk="${k}" data-pidm="${esc(m.name)}" ${on?"checked":""} ${v.id?"":"disabled"} aria-label="Pakai PID ${k.toUpperCase()} ${esc(m[k])}"><b>${k.toUpperCase()}</b>${esc(m[k])}</label>`}).join("")}</div>`:`<small class="pid">PID belum diisi di daftar ${esc(br.name)}</small>`)
      :br?`<small class="pid miss">Belum ada di daftar ${esc(br.name)} <button class="addmot" data-addmot="${br.code}" data-name="${esc(name)}">+ Tambahkan ke daftar</button></small>`:`<small class="pid">Pilih Brand dulu agar PID terdeteksi</small>`;
    return `<div class="mslot"><input class="cin min" list="${list}" data-mi="${i}" value="${esc(name)}" placeholder="${i?"+ motif "+(i+1):"Ketik motif…"}" autocomplete="off" aria-label="Motif ${i+1}">${info}</div>`}).join("")}</div>`;
}
function motifDatalists(codes){
  const opt=m=>`<option value="${esc(m.name)}">${esc([m.ih&&"IH "+m.ih,m.lv&&"LV "+m.lv].filter(Boolean).join(" · ")||"PID belum diisi")}</option>`;
  return codes.map(c=>`<datalist id="ml-${c}">${libOf(c).map(opt).join("")}</datalist>`).join("")+`<datalist id="ml-ALL">${S.brands.flatMap(b=>libOf(b.code)).map(opt).join("")}</datalist>`;
}
/* every date of the month: its rows + one empty row to type into; empty Sundays fold into a MINGGU row; filters hide non-matching rows and dates.
   Laid out like Google Sheets: column letters on top, row numbers on the left (row 1 = column titles), fixed column widths, frozen columns. */
const COLRN=40;
const DEFW={tgl:50,hari:72,dropdown:140,link:170,check:64,motif:220,long:240,shot:100,brand:180,number:100,date:130,text:130};
function defW(col){if(col.key==="scr")return 300;if(col.key==="st")return 150;if(col.key==="slot")return 64;if(col.key==="jam")return 84;if(col.key==="week")return 104;return DEFW[col.type]||130}
function colW(kind,col,dense){const u=S.colW[kind]&&S.colW[kind][col.key];return u||Math.round(defW(col)*(dense?.85:1))}
function frzOf(b){const v=S.frz[b.code];if(v!=null)return v;if(b.ig){const i=colsOf(b).findIndex(c=>c.key==="brand");return i>=0?i+1:2}return 3}
function sheetTable(b,rows,ctx){
  const cols=colsOf(b),nd=daysIn(S.ym),span=cols.length,flt=activeFilters(b.code),filtering=Object.keys(flt).length>0,fon=filterOn(b.code)||filtering;
  ctx.b=b;ctx.frz=new Set(cols.slice(0,Math.min(frzOf(b),cols.length)).map(c=>c.key));S.mAnchor={};S.hasF=false;
  /* layout with row numbers first (unfiltered), so numbers and formula references stay put while filtering */
  const G={rows:[null,{head:true}],cols},lay=[];let n=1;const hid=new Set(metaOf(b.code).hideG||[]);
  for(let d=1;d<=nd;d++){const its=rows.filter(r=>r.d===d),wd=dow(d),sunKey=b.code+"|"+S.ym+"|"+d;
    if(hid.has(d)&&!its.length)continue; /* deleted date */
    if(!its.length&&wd===0&&!S.openSun.has(sunKey)){n++;G.rows.push({d});lay.push({d,sun:sunKey,num:n});continue}
    lay.push({d,items:(hid.has(d)?its:[...its,null]).map(r=>{n++;G.rows.push({d,r});return {r,num:n}})})}
  S.grid=G;
  let body="";
  for(const L of lay){const d=L.d,wd=dow(d),alt=wd===0?"sun":(wd%2===0)?"alt":"",fz=k=>ctx.frz.has(k)?"stk":"";
    if(L.sun){if(filtering)continue;body+=`<tr class="minggu daystart" data-n="${L.num}" data-sund="${d}"><td class="rn">${L.num}</td><td class="tgl ${fz("tgl")}" data-k="tgl">${d}</td><td class="hari ${fz("hari")}" data-k="hari">MINGGU</td><td colspan="${span-2}"><button class="btn sm press" data-opensun="${esc(L.sun)}">+ Isi konten hari Minggu</button></td></tr>`;continue}
    let its=L.items;if(filtering){its=its.filter(x=>x.r&&passFilter(x.r,flt,cols));if(!its.length)continue}
    /* merged cells: stored on the top-left row as mg[key]=[rows,cols]; only inside one date, not while filtering */
    const cover=new Set(),spans={};
    if(!filtering){const real=its.filter(x=>x.r).map(x=>x.r);
      real.forEach((r,ix)=>{if(!r.mg)return;for(const [k,sz] of Object.entries(r.mg)){const ci=cols.findIndex(c=>c.key===k);if(ci<2||cover.has(r.id+"|"+k))continue;
        const R2=Math.min(+sz[0]||1,real.length-ix),C2=Math.min(+sz[1]||1,cols.length-ci);if(R2*C2<2)continue;spans[r.id+"|"+k]=[R2,C2];
        for(let i=0;i<R2;i++)for(let j=0;j<C2;j++)if(i||j){const kk=real[ix+i].id+"|"+cols[ci+j].key;cover.add(kk);S.mAnchor[kk]={rk:r.id,ck:k}}}})}
    const n2=its.length;
    its.forEach((x,ix)=>{
      const r=x.r,v=r||{_ghost:d},c=r&&campOf(r),promo=r&&!c&&/promo/i.test(v.pil||"");
      body+=`<tr class="${alt} ${ix===0?"daystart":""} ${r?"":"ghost"} ${c?"camp":""} ${promo?"promo":""}" ${r?`data-id="${r.id}"`:`data-date="${d}"`} data-n="${x.num}" style="${c?`--cc:${c.color};`:""}${r&&r.rh?`height:${+r.rh}px`:""}">`;
      body+=`<td class="rn" title="Baris ${x.num}">${x.num}${r?`<span class="rrz" data-rrz title="Tarik untuk mengubah tinggi baris, klik dua kali untuk otomatis"></span>`:""}</td>`;
      for(const col of cols){
        if(col.type==="tgl"){if(ix===0)body+=`<td class="tgl ${fz(col.key)} ${isToday(d)?"today":""}" data-k="${col.key}" rowspan="${n2}" ${isToday(d)?'id="todayCell"':""}>${d}${isToday(d)?`<small>HARI INI</small>`:""}</td>`;continue}
        if(col.type==="hari"){if(ix===0)body+=`<td class="hari ${fz(col.key)} ${isToday(d)?"today":""}" data-k="${col.key}" rowspan="${n2}">${HARI[wd]}</td>`;continue}
        const ck=r?r.id+"|"+col.key:"";if(ck&&cover.has(ck))continue;const sp=ck&&spans[ck];
        body+=cellHtml(col,v,Object.assign({},ctx,{tag:c?c.name:promo?"Promo":"",span:sp?`rowspan="${sp[0]}" colspan="${sp[1]}"`:""}));
      }
      body+=`</tr>`;
    });
  }
  if(!body)body=`<tr><td class="rn"></td><td colspan="${span}" class="nores">Tidak ada konten yang cocok dengan filter. <button class="btn sm press" data-fclear>Hapus filter</button></td></tr>`;
  const dn=S.density,kind=b.ig?"ig":"tt",scope=filterScope(b.code),dense=dn!=="normal";
  const stk=k=>ctx.frz.has(k)?"stk":"";
  const rz=col=>`<span class="rz" data-rz="${col.key}" title="Tarik untuk mengubah lebar kolom, klik dua kali untuk ukuran awal" aria-hidden="true"></span>`;
  const letters=cols.map((col,i)=>`<th data-col="${col.key}" data-k="${col.key}" class="${stk(col.key)}" title="Kolom ${colLetter(i)} · klik untuk memilih, klik kanan untuk opsi">${colLetter(i)}${rz(col)}</th>`).join("");
  const th=cols.map(col=>{const k=col.key,act=flt[k];
    return `<th data-col="${k}" data-k="${k}" class="${stk(k)}" title="Klik untuk memilih kolom · klik kanan untuk opsi kolom"><span class="thl">${esc(col.label)}</span>${fon&&col.type!=="tgl"&&col.type!=="hari"?`<button class="fbtn ${act?"on":""}" data-filt="${k}" aria-label="Filter ${esc(col.label)}" title="Filter & urutkan">${act?"⏷":"▾"}</button>`:""}${rz(col)}</th>`}).join("");
  let tot=COLRN;const cg=cols.map(col=>{const w=colW(kind,col,dense);tot+=w;return `<col data-col="${col.key}" style="width:${w}px">`}).join("");
  const fchips=Object.entries(flt).map(([k,vals])=>`<span class="fchip">${esc(colLabel(k))}: ${esc(vals.slice(0,3).join(", "))}${vals.length>3?" +"+(vals.length-3):""}<button data-fdel="${k}" aria-label="Hapus filter ${esc(colLabel(k))}">✕</button></span>`).join("");
  return `${guideHtml(b.ig)}
  <div class="tbar"><span class="hint">${cols.length} kolom · klik kanan pada sel, nomor baris atau huruf kolom untuk semua opsi${hid.size&&!S.ro?` · <button class="linkb" data-unhide>Tampilkan lagi ${hid.size} baris kosong yang dihapus</button>`:""}</span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm press ${fon?"acc":""}" data-ftoggle title="Tampilkan / sembunyikan tombol filter di judul kolom">${fon?"Matikan filter":"Buat filter"}</button><button class="btn sm press" data-colreset="${kind}" title="Kembalikan semua lebar kolom ke ukuran awal">Reset lebar kolom</button>
    <div class="seg" role="group" aria-label="Ukuran tabel">${[["normal","Normal"],["dense","Ringkas"],["fit","Muat layar"]].map(([k,l])=>`<button data-density="${k}" aria-pressed="${dn===k}">${l}</button>`).join("")}</div></div></div>
  ${fon?`<div class="fbar"><b>Filter</b>${fchips||`<span class="sub">Klik ▾ di judul kolom untuk memfilter atau mengurutkan.</span>`}<span style="flex:1"></span><span class="sub">Berlaku untuk:</span><div class="seg" role="group" aria-label="Filter berlaku untuk"><button data-fscope="me" aria-pressed="${scope==="me"}">Saya saja</button><button data-fscope="all" aria-pressed="${scope==="all"}">Semua tim</button></div>${filtering?`<button class="btn sm press" data-fclear>Hapus semua filter</button>`:""}</div>`:""}
  <div class="tzone">${gbar()}<div class="sheet-wrap ${dense?"dense":""} ${dn==="fit"?"fit":""}" tabindex="-1" data-kind="${kind}" data-code="${b.code}" style="--c:${b.color}">${motifDatalists(b.ig?S.brands.map(x=>x.code):[b.code])}<table class="sheet" style="width:${tot}px"><colgroup><col style="width:${COLRN}px">${cg}</colgroup><thead><tr class="letters"><th class="rn corner" data-all title="Pilih semua sel"></th>${letters}</tr><tr class="labels"><th class="rn">1</th>${th}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
/* rekap motif TikTok: keranjang kuning vs non keranjang */
function motifKKTable(b){
  const real=rowsOf(b.code).filter(hasContent), total=real.length, kk=real.filter(r=>r.kerkun).length, non=total-kk, pct=x=>total?Math.round(x/total*100):0;
  const rows=motifCounts(real).map(([m,v])=>[m,v.kk,v.n-v.kk,v.n]);
  const sum=rows.reduce((a,r)=>[a[0]+r[1],a[1]+r[2],a[2]+r[3]],[0,0,0]);
  if(!total)return `<article class="card lift"><div class="head"><div><h2>Rekap motif</h2><p class="sub">Berapa kali tiap motif dikontenkan, dipisah keranjang kuning</p></div></div><p class="sub">Belum ada konten di bulan ini.</p></article>`;
  return `<article class="card lift"><div class="head"><div><h2>Rekap motif</h2><p class="sub">Berapa kali tiap motif dikontenkan, dipisah keranjang kuning</p></div></div>
   <div class="kkbar"><span class="kk" style="flex:${kk}">Keranjang kuning <b>${kk}</b> (${pct(kk)}%)</span><span class="nk" style="flex:${Math.max(non,1)}">Non <b>${non}</b> (${pct(non)}%)</span></div>
   <table class="mini"><thead><tr><th>Motif</th><th class="n">Keranjang kuning</th><th class="n">Non keranjang</th><th class="n">Total</th></tr></thead>
   <tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n kkc">${r[1]}</td><td class="n">${r[2]}</td><td class="n"><b>${r[3]}</b></td></tr>`).join("")}</tbody>
   <tfoot><tr><td>Total</td><td class="n">${sum[0]}</td><td class="n">${sum[1]}</td><td class="n">${sum[2]}</td></tr></tfoot></table>
   <p class="note" style="margin-top:8px">Dihitung dari kolom KERKUN. Satu konten dengan beberapa motif dihitung di setiap motifnya.</p></article>`;
}
/* rekap Instagram: motif per brand, pilar, konten per brand, format */
function countBy(rows,f){const m={};rows.forEach(r=>{const k=r[f];if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function cbars(list,colorFn){const mx=Math.max(1,...list.map(x=>x[1]));return list.map(([n,v])=>`<div class="hb" style="--c:${colorFn(n)}"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="track"><span style="width:${Math.round(v/mx*100)}%"></span></div><b class="num">${v}</b></div>`).join("")||`<p class="sub">Belum ada data.</p>`}
function igRecaps(rows){
  const brands=S.brands.filter(x=>rows.some(r=>r.brand===x.name));
  const motifPerBrand=brands.map(x=>{const cnt={};rows.filter(r=>r.brand===x.name).forEach(r=>(r.motifs||[]).forEach(m=>{if(m)cnt[m]=(cnt[m]||0)+1}));const ms=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);return `<div class="mpb"><span class="chip" style="--c:${x.color}"><i></i>${esc(x.name)}</span>${ms.map(([m,n])=>`<div class="mrow2"><span>${esc(m)}</span><b class="num">${n}</b></div>`).join("")}</div>`}).join("")||`<p class="sub">Belum ada data.</p>`;
  return `<article class="card lift"><div class="head"><div><h2>Rekap motif tiap brand</h2><p class="sub">Motif yang dipakai di Instagram, per brand</p></div></div><div class="mpbgrid">${motifPerBrand}</div></article>
    <article class="card lift"><div class="head"><div><h2>Jumlah pilar</h2><p class="sub">${rows.length} konten Instagram</p></div></div>${cbars(countBy(rows,"pil"),n=>optColor("pil:ig",n)||"#9AA0A6")}</article>
    <article class="card lift"><div class="head"><div><h2>Jumlah konten tiap brand</h2></div></div>${cbars(countBy(rows,"brand"),n=>(byCode(n)||{}).color||"#9AA0A6")}</article>
    <article class="card lift"><div class="head"><div><h2>Jumlah format</h2></div></div>${cbars(countBy(rows,"format"),n=>optColor("format",n)||"#C13584")}</article>`;
}

  return `<article class="card mltab" style="--c:${b.color}"><div class="head"><div><h2>${top?"Daftar 10 Motif Teratas":"Daftar Motif Baru"}</h2><p class="sub">${esc(b.ig?"Instagram":b.name)} · ${esc(ymLabel(S.ym))} · diisi manual${top?", urutan 1 = teratas":""}</p></div></div>

document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest(".sheet td")){S.fresh=false;if(e.target.tagName==="TEXTAREA"){autoSizeOne(e.target);const fx=document.getElementById("fxIn");if(fx&&document.activeElement!==fx)fx.value=e.target.value}}});

/* ---- copy / cut / paste with the system clipboard (works with Google Sheets and Excel) ---- */
const tsvCell=s=>/[\t\n"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function parseTSV(txt){txt=String(txt).replace(/\r\n?/g,"\n");if(txt.endsWith("\n"))txt=txt.slice(0,-1);const rows=[[]];let cur="",q=false,i=0;
  while(i<txt.length){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i+=2;continue}q=false;i++;continue}cur+=ch;i++;continue}
    if(ch==='"'&&cur===""){q=true;i++;continue}
    if(ch==="\t"){rows[rows.length-1].push(cur);cur="";i++;continue}
    if(ch==="\n"){rows[rows.length-1].push(cur);rows.push([]);cur="";i++;continue}
    cur+=ch;i++}
  rows[rows.length-1].push(cur);return rows.map(r=>r.map(t=>({t})))}
function buildClip(){const R=rect();if(!R)return null;const b=curB();
  const cells=R.rows.map(rk=>{const r=rowById(rk);return R.cols.map(col=>{const v=r?(col.type==="motif"?(r.motifs||[]).slice():r[col.key]):"";
    return {t:cellText(r,col),v:v==null?"":JSON.parse(JSON.stringify(v)),type:col.type,fmt:r&&r.fmt&&r.fmt[col.key]?Object.assign({},r.fmt[col.key]):null,note:r&&r.notes&&r.notes[col.key]||"",lk:r&&r.lk&&r.lk[col.key]||""}})});
  return {code:b.code,cells,tsv:cells.map(row=>row.map(c=>tsvCell(c.t)).join("\t")).join("\n")}}
function copyRange(cut){const c=buildClip();if(!c)return null;S.gclip=c;
  document.querySelectorAll(".sheet .cclip").forEach(x=>x.classList.remove("cclip"));const R=rect();for(const rk of R.rows)for(const col of R.cols){const td=cellTd(rk,col.key);if(td)td.classList.add("cclip")}
  if(cut)clearRange(true);
  toast(`${R.n} sel ${cut?"dipotong":"disalin"}. Pilih sel tujuan lalu Ctrl+V atau klik kanan → Tempel`);return c}
function clearRange(quiet){if(!canWrite())return;const R=rect();if(!R)return;const b=curB();let n=0;pushUndo(true);
  for(const rk of R.rows){const r=rowById(rk);if(!r)continue;for(const col of R.cols){if(col.type==="tgl"||col.type==="hari")continue;clearCell(r,col);n++}}
  touch();render();if(!quiet)toast(`Isi ${n} sel dihapus`,"Urungkan",undo)}
function applyCell(r,col,c,mode,b){if(!col||col.type==="tgl"||col.type==="hari"||col.type==="shot")return;
  if(mode!=="format"){if(c.type&&c.type===col.type&&c.v!==undefined){if(col.type==="motif")r.motifs=(c.v||[]).slice(0,3);else r[col.key]=JSON.parse(JSON.stringify(c.v))}else setCellText(r,col,c.t,b);
    if(mode==="all"&&c.type!==undefined){r.notes=r.notes||{};r.lk=r.lk||{};c.note?r.notes[col.key]=c.note:delete r.notes[col.key];c.lk?r.lk[col.key]=c.lk:delete r.lk[col.key]}}
  if(mode!=="values"&&c.type!==undefined){r.fmt=r.fmt||{};c.fmt?r.fmt[col.key]=Object.assign({},c.fmt):delete r.fmt[col.key]}}
function pasteGrid(cells,mode){if(!canWrite())return;
  const R=rect(),b=curB(),rs=curRows();if(!R||!rs||!cells||!cells.length)return;
  const cols=selCols();pushUndo(true);
  const apply=(r,col,c)=>applyCell(r,col,c,mode,b);
  let first=null,last=null,n=0;
  if(cells.length===1&&cells[0].length===1&&R.n>1){
    for(const rk of R.rows){const r=rowById(rk);if(!r)continue;R.cols.forEach(col=>{apply(r,col,cells[0][0]);n++})}
    first=R.rows[0];last=R.rows[R.rows.length-1];
    S.cs.a={rk:first,ck:R.cols[0].key};S.cs.f={rk:last,ck:R.cols[R.cols.length-1].key};
  }else{
    let i=R.r0;const sl=R.sl;
    for(const line of cells){if(i>=sl.length)break;const rk=sl[i];let r=rowById(rk);
      if(!r){const d=+rk.slice(1);if(!d)break;r={id:rid(),d};const lastIx=rs.map(x=>x.d).lastIndexOf(d);rs.splice(lastIx<0?rs.length:lastIx+1,0,r)}else i++;
      if(!first)first=r.id;last=r.id;
      line.forEach((c,j)=>{const col=cols[R.c0+j];if(col){apply(r,col,c);n++}});}
    const w=Math.max(...cells.map(l=>l.length));
    S.cs.a={rk:first,ck:cols[R.c0].key};S.cs.f={rk:last,ck:cols[Math.min(cols.length-1,R.c0+w-1)].key};
  }
  touch();render();toast(`${n} sel ditempel${mode==="values"?" (hanya nilai)":mode==="format"?" (hanya format)":""}`,"Urungkan",undo);
}
function clipOwner(){if(!gridActive()&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".sheet tbody td")))return false;const a=document.activeElement,R=rect();if(!R)return false;
  if(isText(a)&&a.selectionStart!==a.selectionEnd&&!S.fresh&&R.n===1)return false;return true}
document.addEventListener("copy",e=>{if(!clipOwner())return;const R=rect();const a=document.activeElement;if(R.n===1&&isText(a)&&!S.fresh&&a.selectionStart!==a.selectionEnd)return;e.preventDefault();const c=copyRange(false);if(c)e.clipboardData.setData("text/plain",c.tsv)});
document.addEventListener("cut",e=>{if(!clipOwner())return;if(S.ro){e.preventDefault();canWrite();return}const a=document.activeElement,R=rect();if(R.n===1&&isText(a)&&!S.fresh&&a.selectionStart!==a.selectionEnd)return;e.preventDefault();const c=buildClip();if(!c)return;e.clipboardData.setData("text/plain",c.tsv);copyRange(true)});
document.addEventListener("paste",e=>{if(!clipOwner())return;if(S.ro){e.preventDefault();canWrite();return}const txt=(e.clipboardData&&e.clipboardData.getData("text/plain"))||"";const a=document.activeElement,R=rect();
  const multi=/[\t\n]/.test(txt.replace(/\r?\n$/,""));
  if(!multi&&R.n===1&&isText(a)&&!S.gclip)return;
  if(!multi&&R.n===1&&isText(a)&&S.gclip&&S.gclip.tsv!==txt.replace(/\r\n?/g,"\n").replace(/\n$/,""))return;
  e.preventDefault();const mode=S.pvOnly?"values":"all";S.pvOnly=false;
  if(S.gclip&&S.gclip.tsv===txt.replace(/\r\n?/g,"\n").replace(/\n$/,""))pasteGrid(S.gclip.cells,mode);else if(txt)pasteGrid(parseTSV(txt),"values")});
async function menuPaste(mode){if(!canWrite())return;
  let txt=null;try{if(navigator.clipboard&&navigator.clipboard.readText)txt=await navigator.clipboard.readText()}catch(_){txt=null}
  if(txt!=null&&txt!==""&&(!S.gclip||S.gclip.tsv!==txt.replace(/\r\n?/g,"\n").replace(/\n$/,""))){if(mode==="format"){toast("Tempel hanya format memakai salinan dari dashboard ini");return}pasteGrid(parseTSV(txt),"values");return}
  if(S.gclip){pasteGrid(S.gclip.cells,mode);return}
  toast("Untuk menempel dari Google Sheets atau Excel, tekan Ctrl+V");
}

/* ---- rows ---- */
function rangeRows(){const R=rect();if(!R)return [];return R.rows.map(rowById).filter(Boolean)}
function insertRow(where){if(!canWrite())return;const R=rect(),rs=curRows();if(!R||!rs)return;const rk=where==="above"?R.rows[0]:R.rows[R.rows.length-1];let r=rowById(rk),nr;pushUndo(true);
  if(!r){const d=+rk.slice(1);nr={id:rid(),d};const li=rs.map(x=>x.d).lastIndexOf(d);rs.splice(li<0?rs.length:li+1,0,nr)}
  else{nr={id:rid(),d:r.d};const i=rs.indexOf(r);rs.splice(where==="above"?i:i+1,0,nr)}
  S.cs.a=S.cs.f={rk:nr.id,ck:S.cs.f.ck};S.cs.a=Object.assign({},S.cs.f);touch();S.refocus=Object.assign({},S.cs.f);render();toast("1 baris disisipkan di tanggal "+nr.d,"Urungkan",undo)}

function deleteRows(){if(!canWrite())return;const R=rect(),rs=curRows(),b=curB();if(!R||!rs)return;
  const rows=R.rows.map(rowById).filter(Boolean),ghosts=R.rows.filter(rk=>rk[0]==="g"&&!rowById(rk)).map(rk=>+rk.slice(1));
  const ds=R.rows.map(rk=>{const r=rowById(rk);return r?r.d:+rk.slice(1)}),lo=Math.min(...ds),hi=Math.max(...ds);
  const folds=[...document.querySelectorAll(".sheet tbody tr.minggu[data-sund]")].map(tr=>+tr.dataset.sund).filter(d=>d>lo&&d<hi);

  pushUndo(true);rows.forEach(r=>{const i=rs.indexOf(r);if(i>=0)rs.splice(i,1)});hideDates(b.code,[...ghosts,...folds]);
  S.cs=null;touch();render();toast(`${rows.length+ghosts.length+folds.length} baris dihapus`,"Urungkan",undo)}
function hideDates(code,ds){if(!ds.length)return;const mt=metaOf(code),h=new Set(mt.hideG||[]);ds.forEach(d=>h.add(d));mt.hideG=[...h].sort((a,c)=>a-c)}

function openFilter(key,btn){closeMenus();const b=curB(),cols=colsOf(b),col=cols.find(c=>c.key===key);if(!col)return;
  const cnt=new Map();rowsOf(b.code).forEach(r=>filterVals(r,col).forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)));

  const cur=activeFilters(b.code)[key];

  const r=btn.getBoundingClientRect();placeMenu(p,r.left,r.bottom+4);const s=p.querySelector(".fsearch");s.focus({preventScroll:true});
  const upd=()=>{const all=p.querySelectorAll(".flist input"),on=[...all].filter(x=>x.checked).length;p.querySelector(".fn").textContent=` ${on}/${all.length} dipilih`};upd();
  p.addEventListener("change",upd);
  s.addEventListener("input",()=>{const q=s.value.toLowerCase();p.querySelectorAll(".flist label").forEach(l=>l.hidden=!l.textContent.toLowerCase().includes(q))});

}
